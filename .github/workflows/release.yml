name: Release

on:
  push:
    # Stable semver only. "v*" would also match a prerelease tag like
    # v1.0.0-rc.1, and imagetools would then move :latest/:1/:1.0 (plus a junk
    # :1.0.0-rc tag) and softprops/action-gh-release would publish it as a
    # full, non-prerelease GitHub Release (it does not auto-detect
    # prereleases) — cortex-app's selfhost/README.md installer fetches
    # releases/latest/download/stack.json, so every new install would get the
    # RC. Prerelease tags are deliberately excluded here.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mocaos/cortex-chat

jobs:
  guard:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must equal package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$pkg tag=$tag"
          [ "$pkg" = "$tag" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version $pkg"
            exit 1
          }

      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          # This published GHCR image is consumed by third-party self-hosters
          # (selfhost/docker-compose.yml in cortex-app) — their end users'
          # browser errors must never reach the maintainers' GlitchTip.
          # NEXT_PUBLIC_SENTRY_DISABLED is inlined into the browser bundle at
          # build time (see the Dockerfile's builder-stage ARG/ENV), so it is
          # the only way to turn off client-side reporting; the runtime-only
          # SENTRY_DISABLED env var cannot reach code already inlined into the
          # bundle. The maintainers' own Dokploy/Coolify deployments build
          # straight from this Dockerfile and never pass this arg, so they are
          # unaffected and keep reporting to the maintainers' GlitchTip.
          build-args: |
            NEXT_PUBLIC_SENTRY_DISABLED=1
          cache-from: type=gha,scope=chat-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=chat-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.push.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  manifest:
    name: Merge manifest and release
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push the multi-arch manifest
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          refs=""
          for f in /tmp/digests/*; do
            refs="$refs ${IMAGE}@$(cat "$f")"
          done

          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${MINOR}" \
            -t "${IMAGE}:${MAJOR}" \
            -t "${IMAGE}:latest" \
            $refs

          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

# Dev-only OIDC IdP for testing the SSO integration locally.
#
#   docker compose -f docs/dev/keycloak/docker-compose.yml up -d
#
# Imports the `cortex` realm (see cortex-realm.json) with the client
# `cortex-chat` and password test users on first boot. Admin console at
# http://localhost:8080 (admin / admin).
#
# App env to pair with it:
#   OIDC_ISSUER_URL=http://localhost:8080/realms/cortex
#   OIDC_CLIENT_ID=cortex-chat
#   OIDC_CLIENT_SECRET=dev-secret-cortex-chat
#   APP_BASE_URL=http://localhost:3000   # or :3005 / :3006 — all registered
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./cortex-realm.json:/opt/keycloak/data/import/cortex-realm.json:ro
